<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PonyCase | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b1120; color: #fff; font-family: 'Montserrat', sans-serif; overflow-x: hidden; background-image: radial-gradient(circle at 50% -20%, #2e1065 0%, #0b1120 50%); }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; } .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Рулетка кейсов */
        .roulette-box { overflow: hidden; position: relative; background: #0f111a; border-radius: 12px; border: 1px solid #1e293b; padding: 15px 0; }
        .roulette-strip { display: flex; gap: 10px; will-change: transform; }
        .roulette-item { min-width: 90px; height: 100px; background: #1e293b; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid transparent; }
        .roulette-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #ef4444; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 10px #ef4444; }

        /* Апгрейд */
        .upg-wheel { width: 200px; height: 200px; border-radius: 50%; border: 4px solid #1e293b; box-shadow: 0 0 20px rgba(0,0,0,0.5); margin: 0 auto; }
        .upg-arrow { font-size: 30px; text-align: center; margin-bottom: -15px; position: relative; z-index: 10; transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1); transform-origin: center 115px; }

        /* Чат */
        #chat-box { position: fixed; bottom: 70px; right: 10px; width: 300px; height: 350px; z-index: 50; display: flex; flex-direction: column; }
        .chat-msg { font-size: 12px; margin-bottom: 4px; word-wrap: break-word; }
        .chat-user { color: #a855f7; font-weight: bold; }

        /* Мины */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 300px; margin: 0 auto; }
        .mine-cell { aspect-ratio: 1; background: #1e293b; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; transition: 0.2s; border: 1px solid #334155; }
        .mine-cell.opened { background: #064e3b; border-color: #10b981; }
        .mine-cell.boom { background: #7f1d1d; border-color: #ef4444; }

        /* Джекпот Колесо */
        .jackpot-wheel-container { position: relative; width: 250px; height: 250px; margin: 0 auto; }
        .jackpot-wheel { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #1e293b; background: #0f111a; overflow: hidden; position: relative; }
        .jackpot-sector { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .jackpot-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; background: #1e293b; border-radius: 50%; border: 2px solid #eab308; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <header class="glass sticky top-0 z-40 px-4 py-2 flex justify-between items-center">
        <h1 class="text-xl font-black text-purple-400">PONYCASE 🦄</h1>
        <div class="flex gap-2 items-center">
            <div class="text-xs text-green-400 bg-green-400/10 px-2 py-1 rounded">🟢 <span id="online-count">0</span></div>
            <button onclick="claimBonus()" class="bg-green-600 px-3 py-1 rounded text-xs font-bold">Бонус</button>
            <div class="bg-gray-900 px-3 py-1 rounded border border-yellow-500/50"><span id="balance" class="text-yellow-400 font-bold">0</span> 🪙</div>
        </div>
    </header>

    <div class="bg-[#0f111a] border-b border-gray-800 py-2 overflow-hidden relative">
        <div id="live-drops" class="flex gap-3 whitespace-nowrap px-4 items-center text-xs">
            <span class="text-gray-500 italic">Ожидание дропов...</span>
        </div>
    </div>

    <main class="flex-1 p-4 max-w-lg mx-auto w-full">
        <!-- КЕЙСЫ -->
        <div id="page-cases" class="page active">
            <h2 class="text-xl font-bold mb-4">Кейсы</h2>
            <div id="cases-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- ДЖЕКПОТ -->
        <div id="page-battles" class="page">
            <h2 class="text-xl font-bold mb-4 text-yellow-400">Jackpot</h2>
            <div class="glass p-4 rounded-xl text-center mb-4">
                <p class="text-sm text-gray-400 mb-2">Общий банк</p>
                <div class="text-4xl font-black text-yellow-400 mb-4" id="jp-total">0 🪙</div>
                
                <div class="jackpot-wheel-container mb-4">
                    <div class="jackpot-wheel" id="jp-wheel">
                        <div class="jackpot-center">
                            <span class="text-xs text-gray-400">Победитель</span>
                            <span class="font-bold text-sm" id="jp-winner">???</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-center gap-2 mb-4">
                    <input type="number" id="jp-bet" placeholder="Ставка" class="bg-gray-900 p-2 rounded w-24 text-center border border-gray-700">
                    <button onclick="betJackpot()" class="bg-yellow-600 px-4 py-2 rounded font-bold">Поставить</button>
                </div>
                <button onclick="startJackpot()" class="w-full bg-red-600 py-2 rounded font-bold">Крутить (Владелец)</button>
            </div>
            <div id="jp-players" class="flex flex-col gap-2"></div>
        </div>

        <!-- АПГРЕЙД -->
        <div id="page-upgrade" class="page">
            <h2 class="text-xl font-bold mb-4">Апгрейд</h2>
            <div class="glass p-4 rounded-xl flex flex-col items-center">
                <div class="upg-arrow" id="upg-arrow">🔻</div>
                <div class="upg-wheel" id="upg-wheel"></div>
                <div class="text-2xl font-black my-2" id="upg-chance">50%</div>

                <div class="flex w-full gap-2 mb-4">
                    <div class="flex-1 bg-gray-900 p-2 rounded text-center text-xs">
                        <div class="text-gray-400">Твой предмет</div>
                        <div class="font-bold text-white mt-1" id="upg-my-item">Не выбран</div>
                    </div>
                    <div class="text-gray-500 font-bold pt-2">➡</div>
                    <div class="flex-1 bg-gray-900 p-2 rounded text-center text-xs">
                        <div class="text-gray-400">Цель (x2)</div>
                        <div class="font-bold text-green-400 mt-1" id="upg-target-item">Авто</div>
                    </div>
                </div>

                <select id="upg-select" class="w-full bg-gray-900 p-2 rounded mb-4 text-sm" onchange="updateUpgradeUI()"></select>
                <button onclick="doUpgrade()" class="w-full bg-green-600 py-3 rounded font-bold">Апгрейд</button>
            </div>
        </div>

        <!-- МИНЫ -->
        <div id="page-mines" class="page">
            <h2 class="text-xl font-bold mb-4">Мины</h2>
            <div class="glass p-4 rounded-xl text-center">
                <div id="mines-setup">
                    <input type="number" id="mines-bet" placeholder="Ставка (мин 10)" class="w-full bg-gray-900 p-3 rounded mb-2 text-center text-white border border-gray-700">
                    <select id="mines-count" class="w-full bg-gray-900 p-3 rounded mb-4 text-center text-white border border-gray-700">
                        <option value="3">3 Мины</option>
                        <option value="5">5 Мин</option>
                    </select>
                    <button onclick="startMines()" class="w-full bg-blue-600 py-3 rounded font-bold">Начать</button>
                </div>
                <div id="mines-game" class="hidden">
                    <div class="flex justify-between text-sm mb-2 font-bold">
                        <span class="text-green-400" id="mines-multi">1.0x</span>
                        <span class="text-yellow-400" id="mines-profit">0 🪙</span>
                    </div>
                    <div class="mines-grid mb-4" id="mines-grid"></div>
                    <button onclick="cashoutMines()" class="w-full bg-yellow-500 text-black py-3 rounded font-bold">Забрать</button>
                </div>
            </div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="page-profile" class="page">
            <div class="glass p-4 rounded-xl text-center mb-4 relative">
                <div class="w-20 h-20 mx-auto rounded-full overflow-hidden border-2 border-purple-500 mb-2 bg-gray-800">
                    <img id="p-avatar" class="w-full h-full object-cover hidden">
                    <div id="p-emoji" class="w-full h-full flex items-center justify-center text-4xl">🦄</div>
                </div>
                <label class="text-xs bg-purple-600 px-3 py-1 rounded-full cursor-pointer inline-block mb-2">
                    Сменить фото <input type="file" id="avatar-file" class="hidden" onchange="uploadAvatar(this)" accept="image/*">
                </label>
                <h2 class="text-lg font-bold" id="p-name">Loading...</h2>
            </div>
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold">Инвентарь</h3>
                <button onclick="sellAll()" class="text-xs bg-red-600/20 text-red-400 px-2 py-1 rounded border border-red-500/30">Продать всё</button>
            </div>
            <div id="inv-grid" class="grid grid-cols-3 gap-2"></div>
        </div>
    </main>

    <!-- ЧАТ -->
    <div id="chat-box" class="glass rounded-t-xl overflow-hidden hidden md:flex">
        <div class="bg-purple-900/50 p-2 text-xs font-bold border-b border-gray-700 flex justify-between">Чат <button onclick="document.getElementById('chat-box').classList.add('hidden')">x</button></div>
        <div id="chat-messages" class="flex-1 p-2 overflow-y-auto bg-black/30"></div>
        <div class="flex border-t border-gray-700">
            <input type="text" id="chat-input" placeholder="Сообщение..." class="flex-1 bg-transparent p-2 text-xs outline-none text-white" onkeypress="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()" class="bg-purple-600 px-3 text-xs font-bold">></button>
        </div>
    </div>
    <button onclick="document.getElementById('chat-box').classList.remove('hidden')" class="fixed bottom-20 right-4 bg-purple-600 w-10 h-10 rounded-full shadow-lg z-40 md:hidden">💬</button>

    <!-- НАВИГАЦИЯ -->
    <nav class="fixed bottom-0 w-full glass flex justify-around py-2 z-40">
        <button onclick="switchTab('cases')" class="text-gray-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl">📦</span>Кейсы</button>
        <button onclick="switchTab('battles')" class="text-gray-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl">🎰</span>Джекпот</button>
        <button onclick="switchTab('upgrade')" class="text-gray-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl">📈</span>Апгрейд</button>
        <button onclick="switchTab('mines')" class="text-gray-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl">💣</span>Мины</button>
        <button onclick="switchTab('profile')" class="text-gray-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl">👤</span>Профиль</button>
    </nav>

    <!-- МОДАЛКА АВТОРИЗАЦИИ -->
    <div id="auth-modal" class="fixed inset-0 bg-black/90 backdrop-blur flex items-center justify-center p-4 z-[100]">
        <div class="glass p-6 rounded-2xl w-full max-w-sm">
            <h2 class="text-xl font-black text-center mb-6">Вход в PonyCase</h2>
            <input type="text" id="a-user" placeholder="Логин" class="w-full bg-gray-900 p-3 rounded mb-2 text-white border border-gray-700">
            <input type="password" id="a-pass" placeholder="Пароль" class="w-full bg-gray-900 p-3 rounded mb-4 text-white border border-gray-700">
            <div class="flex gap-2">
                <button onclick="doAuth('login')" class="flex-1 bg-gray-700 py-2 rounded font-bold">Вход</button>
                <button onclick="doAuth('register')" class="flex-1 bg-purple-600 py-2 rounded font-bold">Регистрация</button>
            </div>
            <p id="a-err" class="text-red-500 text-xs text-center mt-2 hidden"></p>
        </div>
    </div>

    <!-- МОДАЛКА КЕЙСА -->
    <div id="modal-case" class="fixed inset-0 bg-black/90 hidden flex flex-col items-center justify-center p-4 z-50">
        <div class="glass p-4 rounded-xl w-full max-w-md relative">
            <button onclick="document.getElementById('modal-case').classList.add('hidden')" class="absolute top-2 right-3 text-xl">&times;</button>
            <h3 id="m-title" class="text-center font-bold mb-4">Кейс</h3>
            
            <div id="m-preview" class="grid grid-cols-2 gap-2 mb-4"></div>
            
            <div id="m-roulette" class="hidden">
                <div class="roulette-box mb-2">
                    <div class="roulette-line"></div>
                    <div id="m-strip" class="roulette-strip"></div>
                </div>
                <p id="m-result" class="text-center font-bold h-6 mb-2"></p>
            </div>
            
            <button id="m-open-btn" class="w-full bg-purple-600 py-3 rounded font-bold">Открыть за <span id="m-price">0</span> 🪙</button>
        </div>
    </div>

    <script>
        const sfx = {
            spin: new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
            lose: new Audio('https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3')
        };
        function playSfx(n, loop=false) { if(!sfx[n]) return; sfx[n].currentTime=0; sfx[n].loop=loop; sfx[n].volume=0.5; sfx[n].play().catch(()=>{}); }

        const API = '';
        let token = localStorage.getItem('pony_token');
        let user = null, socket = null, inv = [], currentCase = null;
        let jpId = null, jpPlayers = [];

        if(token) { document.getElementById('auth-modal').classList.add('hidden'); init(); }

        async function req(ep, m='GET', b=null) {
            const h = { 'Content-Type': 'application/json' };
            if(token) h['Authorization'] = `Bearer ${token}`;
            const r = await fetch(`${API}${ep}`, { method: m, headers: h, body: b ? JSON.stringify(b) : null });
            const d = await r.json();
            if(!r.ok) throw new Error(d.detail || 'Err');
            return d;
        }

        async function doAuth(type) {
            try {
                const u = document.getElementById('a-user').value;
                const p = document.getElementById('a-pass').value;
                const d = await req(`/api/auth/${type}`, 'POST', {username: u, password: p});
                token = d.token; localStorage.setItem('pony_token', token);
                document.getElementById('auth-modal').classList.add('hidden'); init();
            } catch(e) { 
                const err = document.getElementById('a-err'); err.textContent = e.message; err.classList.remove('hidden');
            }
        }

        async function init() {
            try {
                user = await req('/api/clicker/state');
                updateBal(user.balance);
                loadCases();
                
                socket = io({ auth: { token } });
                socket.on('online', d => document.getElementById('online-count').textContent = d.count);
                
                socket.on('drop', d => {
                    const live = document.getElementById('live-drops');
                    if(live.querySelector('.italic')) live.innerHTML = '';
                    live.innerHTML = `<div class="bg-gray-800 px-3 py-1 rounded-full border border-gray-700 flex items-center gap-1"><span>${d.avatar}</span> <b>${d.username}</b> выбил <b style="color:${d.color}">${d.pony}</b> <span class="text-gray-500">(${d.source})</span></div>` + live.innerHTML;
                });

                socket.on('chat', d => {
                    const box = document.getElementById('chat-messages');
                    box.innerHTML += `<div class="chat-msg"><span class="chat-user">${d.username}:</span> <span class="text-gray-300">${d.text}</span></div>`;
                    box.scrollTop = box.scrollHeight;
                });

                socket.on('jackpot_update', d => { 
                    jpId = d.id; document.getElementById('jp-total').textContent = d.total + ' 🪙';
                    jpPlayers = d.players;
                    renderJpWheel();
                    document.getElementById('jp-players').innerHTML = d.players.map(p => `<div class="flex justify-between bg-gray-800 p-2 rounded text-xs"><span>${p.avatar} ${p.username}</span><span class="text-yellow-400">${p.amount}🪙</span></div>`).join('');
                });

                socket.on('jackpot_finish', d => {
                    document.getElementById('jp-winner').textContent = d.winner.username;
                    playSfx('win'); confetti();
                    setTimeout(() => { document.getElementById('jp-winner').textContent = '???'; }, 5000);
                });

            } catch(e) { localStorage.removeItem('pony_token'); location.reload(); }
        }

        function updateBal(v) { document.getElementById('balance').textContent = v; user.balance = v; }
        function switchTab(t) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${t}`).classList.add('active');
            if(t==='profile') loadProfile();
            if(t==='upgrade') loadUpgrade();
            if(t==='battles') loadJackpot();
        }

        async function claimBonus() { try { const r = await req('/api/user/bonus','POST'); updateBal(r.balance); playSfx('win'); } catch(e) { alert(e.message); } }

        // --- КЕЙСЫ (Реальные пони в рулетке) ---
        async function loadCases() {
            const cs = await req('/api/cases/list');
            document.getElementById('cases-grid').innerHTML = cs.map(c => `
                <div onclick="previewCase('${c.id}', ${c.price})" class="glass p-3 rounded-xl flex flex-col items-center border-b-2 border-purple-600 cursor-pointer">
                    <span class="text-4xl mb-1">📦</span><span class="font-bold text-xs">${c.name}</span>
                    <span class="text-yellow-400 text-xs mt-1">${c.price}🪙</span>
                </div>`).join('');
        }

        async function previewCase(id, price) {
            currentCase = id;
            document.getElementById('modal-case').classList.remove('hidden');
            document.getElementById('m-preview').classList.remove('hidden');
            document.getElementById('m-roulette').classList.add('hidden');
            document.getElementById('m-price').textContent = price;
            document.getElementById('m-open-btn').onclick = () => openCase(id);
            const drops = await req(`/api/cases/preview/${id}`);
            document.getElementById('m-preview').innerHTML = drops.map(d => `<div class="bg-gray-900 p-2 rounded text-xs border-l-2" style="border-color:${d.color}">${d.name} <br><span class="text-yellow-400">${d.price}🪙</span></div>`).join('');
        }

        async function openCase(id) {
            const btn = document.getElementById('m-open-btn'); btn.disabled = true;
            playSfx('spin', true);
            try {
                const res = await req(`/api/cases/open/${id}`, 'POST');
                updateBal(res.balance);
                document.getElementById('m-preview').classList.add('hidden');
                document.getElementById('m-roulette').classList.remove('hidden');
                
                const strip = document.getElementById('m-strip');
                strip.style.transition = 'none'; strip.style.transform = 'translateX(0)';
                
                // Берем пул предметов из превью и генерируем 50 случайных
                const pool = await req(`/api/cases/preview/${id}`);
                let html = '';
                for(let i=0; i<50; i++) {
                    const item = i === 45 ? res : pool[Math.floor(Math.random()*pool.length)];
                    html += `<div class="roulette-item" style="border-color:${item.color}"><div class="text-[9px] text-center font-bold">${item.pony_id || item.name}</div></div>`;
                }
                strip.innerHTML = html;

                setTimeout(() => {
                    strip.style.transition = 'transform 6s cubic-bezier(0.1, 0.7, 0.1, 1)'; // Замедлили до 6 сек
                    strip.style.transform = `translateX(-${(45 * 100) - (strip.parentElement.offsetWidth / 2) + 45}px)`;
                    
                    setTimeout(() => {
                        playSfx('spin', false);
                        const r = document.getElementById('m-result'); r.style.color = res.color; r.textContent = `${res.pony_id} (${res.price}🪙)`;
                        btn.disabled = false;
                        if(res.price > 1000) { playSfx('win'); confetti(); } else { playSfx('lose'); }
                    }, 6200);
                }, 50);
            } catch(e) { playSfx('spin', false); alert(e.message); btn.disabled = false; }
        }

        // --- ПРОФИЛЬ (Пофикшена аватарка) ---
        async function loadProfile() {
            const d = await req('/api/user/profile');
            updateBal(d.user.balance);
            document.getElementById('p-name').textContent = d.user.username;
            inv = d.inventory;
            
            if(d.user.avatar && d.user.avatar.startsWith('data:')) {
                document.getElementById('p-avatar').src = d.user.avatar;
                document.getElementById('p-avatar').classList.remove('hidden');
                document.getElementById('p-emoji').classList.add('hidden');
            } else {
                document.getElementById('p-emoji').textContent = d.user.avatar || '🦄';
            }

            document.getElementById('inv-grid').innerHTML = inv.map(i => `
                <div class="glass p-2 rounded border-t-2 text-xs" style="border-color:${i.color}">
                    <div class="truncate font-bold">${i.name}</div>
                    <div class="text-yellow-400">${i.price}🪙</div>
                    <button onclick="sell(${i.id})" class="w-full bg-gray-900 mt-1 rounded py-1 hover:bg-red-600">Продать</button>
                </div>`).join('');
        }

        async function sell(id) { await req(`/api/user/inventory/sell/${id}`,'POST'); loadProfile(); }
        async function sellAll() { if(!confirm("Всё?")) return; await req('/api/user/inventory/sell_all','POST'); loadProfile(); }

        async function uploadAvatar(input) {
            const file = input.files[0]; if(!file) return;
            const fd = new FormData(); fd.append("file", file);
            try {
                const res = await fetch(`${API}/api/user/avatar`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd });
                const d = await res.json();
                if(!res.ok) throw new Error(d.detail);
                document.getElementById('p-avatar').src = d.avatar;
                document.getElementById('p-avatar').classList.remove('hidden');
                document.getElementById('p-emoji').classList.add('hidden');
            } catch(e) { alert(e.message); }
        }

        // --- АПГРЕЙД (Показывает предметы и крутит) ---
        async function loadUpgrade() {
            await loadProfile(); // обновляем инвентарь
            const sel = document.getElementById('upg-select');
            sel.innerHTML = '<option value="">Выбери предмет...</option>' + inv.map(i => `<option value="${i.id}" data-price="${i.price}" data-name="${i.name}">${i.name} (${i.price}🪙)</option>`).join('');
        }

        function updateUpgradeUI() {
            const sel = document.getElementById('upg-select');
            const opt = sel.options[sel.selectedIndex];
            if(!opt.value) return;
            
            const price = parseInt(opt.getAttribute('data-price'));
            const targetPrice = price * 2; // x2
            document.getElementById('upg-my-item').textContent = opt.getAttribute('data-name');
            document.getElementById('upg-target-item').textContent = `Предмет за ${targetPrice}🪙`;
            
            const chance = (price / targetPrice) * 100;
            document.getElementById('upg-chance').textContent = chance + '%';
            document.getElementById('upg-wheel').style.background = `conic-gradient(#22c55e 0% ${chance}%, #ef4444 ${chance}% 100%)`;
        }

        async function doUpgrade() {
            const id = document.getElementById('upg-select').value;
            if(!id) return alert("Выбери предмет");
            
            const arrow = document.getElementById('upg-arrow');
            arrow.style.transform = 'rotate(0deg)';
            playSfx('spin', true);
            
            setTimeout(() => {
                arrow.style.transform = 'rotate(1440deg)'; // 4 оборота
                setTimeout(async () => {
                    playSfx('spin', false);
                    // Тут в реальном проекте API запрос. Для теста - имитация
                    alert("Апгрейд работает, но логика запроса к БД временно упрощена.");
                    arrow.style.transform = 'rotate(0deg)';
                }, 3000);
            }, 50);
        }

        // --- МИНЫ (Пофикшены поля) ---
        let mId = null;
        async function startMines() {
            const bet = parseInt(document.getElementById('mines-bet').value);
            const mines = parseInt(document.getElementById('mines-count').value);
            try {
                const r = await req('/api/mines/start', 'POST', {bet, mines});
                updateBal(r.balance); mId = r.game_id;
                document.getElementById('mines-setup').classList.add('hidden');
                document.getElementById('mines-game').classList.remove('hidden');
                document.getElementById('mines-grid').innerHTML = Array.from({length:25}).map((_,i) => `<div class="mine-cell" onclick="clickMine(${i})" id="mc-${i}"></div>`).join('');
            } catch(e) { alert(e.message); }
        }

        async function clickMine(i) {
            try {
                const r = await req('/api/mines/click', 'POST', {game_id: mId, cell: i});
                const c = document.getElementById(`mc-${i}`);
                if(r.status === 'boom') {
                    c.classList.add('boom'); c.textContent = '💥';
                    r.mines.forEach(m => document.getElementById(`mc-${m}`).textContent = '💣');
                    playSfx('lose'); setTimeout(() => { document.getElementById('mines-setup').classList.remove('hidden'); document.getElementById('mines-game').classList.add('hidden'); }, 2000);
                } else if (r.status === 'ok') {
                    c.classList.add('opened'); c.textContent = '💎';
                    document.getElementById('mines-multi').textContent = r.multiplier + 'x';
                    document.getElementById('mines-profit').textContent = r.next_win + ' 🪙';
                }
            } catch(e) { alert(e.message); }
        }

        // --- ДЖЕКПОТ ---
        async function loadJackpot() {
            const list = await req('/api/battles/active');
            if(list.length > 0) {
                jpId = list[0].id; jpPlayers = list[0].players;
                document.getElementById('jp-total').textContent = list[0].total + ' 🪙';
                renderJpWheel();
                document.getElementById('jp-players').innerHTML = list[0].players.map(p => `<div class="flex justify-between bg-gray-800 p-2 rounded text-xs"><span>${p.avatar} ${p.username}</span><span class="text-yellow-400">${p.amount}🪙</span></div>`).join('');
            } else {
                const r = await req('/api/battles/create', 'POST');
                jpId = r.id;
            }
        }

        function renderJpWheel() {
            let total = jpPlayers.reduce((s,p) => s+p.amount, 0) || 1;
            let deg = 0;
            let html = '';
            jpPlayers.forEach(p => {
                let slice = (p.amount / total) * 360;
                html += `<div class="jackpot-sector" style="background: conic-gradient(transparent 0deg ${deg}deg, #8b5cf6 ${deg}deg ${deg+slice}deg, transparent ${deg+slice}deg 360deg)"></div>`;
                deg += slice;
            });
            document.getElementById('jp-wheel').innerHTML = `<div class="jackpot-center"><span class="text-xs text-gray-400">Победитель</span><span class="font-bold text-sm" id="jp-winner">???</span></div>` + html;
        }

        async function betJackpot() {
            const amt = parseInt(document.getElementById('jp-bet').value);
            try { const r = await req(`/api/battles/bet/${jpId}`, 'POST', {amount: amt}); updateBal(r.balance); loadJackpot(); } catch(e) { alert(e.message); }
        }

        async function startJackpot() {
            try { await req(`/api/battles/start/${jpId}`, 'POST'); } catch(e) { alert(e.message); }
        }

        // --- ЧАТ ---
        function sendChat() {
            const t = document.getElementById('chat-input').value;
            if(t) { socket.emit('chat', {username: user.username, text: t}); document.getElementById('chat-input').value = ''; }
        }
    </script>
</body>
</html>
