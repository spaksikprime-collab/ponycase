<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonyCase | У нас выигрывают</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --accent: #8b5cf6; }
        body { background-color: var(--bg); color: #f8fafc; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Рулетка */
        .roulette-container { width: 100%; overflow: hidden; position: relative; padding: 20px 0; background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; }
        .roulette-strip { display: flex; gap: 10px; will-change: transform; }
        .roulette-item { min-width: 100px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e293b; border-radius: 8px; border: 2px solid transparent; }
        .roulette-center-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #ef4444; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 15px #ef4444; }
        
        /* Апгрейд Стрелка */
        .upgrade-wheel-container { position: relative; width: 200px; height: 200px; margin: 0 auto; }
        .upgrade-wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#ef4444 0% var(--chance), #22c55e var(--chance) 100%); border: 4px solid #1e293b; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .upgrade-arrow { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 30px; transition: transform 3s cubic-bezier(0.2, 0.8, 0.2, 1); transform-origin: 50% 115px; z-index: 20; }

        /* Анимации */
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .drop-anim { animation: slideDown 0.3s ease-out; }
        .page { display: none; }
        .page.active { display: block; animation: slideDown 0.4s ease-out; }
        
        /* Кликер */
        .click-btn { transition: transform 0.1s; user-select: none; }
        .click-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 select-none">

    <!-- HEADER -->
    <header class="bg-[#0f172a]/90 backdrop-blur-md sticky top-0 z-40 px-4 py-3 flex justify-between items-center border-b border-gray-800 shadow-xl">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 cursor-pointer" onclick="switchTab('cases')">PONYCASE 🦄</h1>
        <div class="flex items-center gap-3">
            <div class="bg-gray-900 px-4 py-1.5 rounded-lg border border-yellow-500/30 flex items-center gap-2">
                <span id="balance" class="text-yellow-400 font-bold text-lg">0</span> <span class="text-yellow-500">🪙</span>
            </div>
        </div>
    </header>

    <!-- LIVE ДРОПЫ -->
    <div class="bg-[#111827] border-b border-gray-800 py-2 overflow-hidden relative shadow-lg">
        <div id="live-drops" class="flex gap-3 whitespace-nowrap px-4 items-center">
            <span class="text-gray-500 text-sm italic">Ожидание дропов...</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 max-w-5xl mx-auto w-full">
        
        <!-- КЕЙСЫ -->
        <div id="page-cases" class="page active">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2"><span class="w-2 h-6 bg-purple-500 rounded"></span> Кейсы</h2>
            <div id="cases-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- КЛИКЕР -->
        <div id="page-clicker" class="page">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2"><span class="w-2 h-6 bg-yellow-500 rounded"></span> Кликер</h2>
            <div class="flex flex-col items-center justify-center">
                <div class="text-4xl mb-8 click-btn cursor-pointer" id="pony-click" onclick="doClick()">🦄</div>
                <p class="text-gray-400 mb-4">Кликов: <span id="click-count" class="text-white font-bold">0</span></p>
                
                <div class="w-full max-w-md bg-[#1e293b] p-4 rounded-xl border border-gray-700">
                    <h3 class="font-bold mb-3 text-center">Апгрейды</h3>
                    <div id="upgrades-list" class="flex flex-col gap-2"></div>
                </div>
            </div>
        </div>

        <!-- АПГРЕЙД -->
        <div id="page-upgrade" class="page">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2"><span class="w-2 h-6 bg-green-500 rounded"></span> Апгрейд</h2>
            <div class="bg-[#1e293b] p-6 rounded-2xl border border-gray-700 shadow-2xl flex flex-col items-center">
                
                <div class="upgrade-wheel-container mb-8">
                    <div class="upgrade-arrow" id="upg-arrow">🔻</div>
                    <div class="upgrade-wheel" id="upg-wheel" style="--chance: 50%;"></div>
                    <div class="absolute inset-0 flex items-center justify-center text-2xl font-bold" id="upg-chance-text">50%</div>
                </div>

                <div class="w-full flex flex-col md:flex-row gap-4 mb-6">
                    <select id="upg-item" class="flex-1 bg-gray-900 p-3 rounded-lg border border-gray-700 text-white outline-none">
                        <option value="">Выбери предмет</option>
                    </select>
                    <input type="number" id="upg-target" placeholder="Цена (🪙)" class="flex-1 bg-gray-900 p-3 rounded-lg border border-gray-700 text-white outline-none">
                </div>
                <button onclick="doUpgrade()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 py-4 rounded-xl font-bold text-lg shadow-lg">Апгрейднуть</button>
            </div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="page-profile" class="page">
            <div class="bg-[#1e293b] p-4 rounded-xl border border-gray-700 mb-6 flex justify-around text-center">
                <div><div class="text-gray-400 text-xs">Всего кликов</div><div id="stat-clicks" class="font-bold text-lg text-yellow-400">0</div></div>
                <div><div class="text-gray-400 text-xs">Кейсов открыто</div><div id="stat-cases" class="font-bold text-lg text-purple-400">0</div></div>
            </div>

            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold flex items-center gap-2"><span class="w-2 h-6 bg-blue-500 rounded"></span> Инвентарь</h2>
                <button onclick="sellAll()" class="bg-red-500/20 text-red-400 border border-red-500/50 px-4 py-2 rounded-lg font-bold">Продать Всё</button>
            </div>
            <div id="inventory-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
        </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 w-full bg-[#0f172a]/95 backdrop-blur-md border-t border-gray-800 flex justify-around py-3 z-40">
        <button onclick="switchTab('cases')" class="text-gray-400 hover:text-purple-400 flex flex-col items-center"><span class="text-2xl">📦</span><span class="text-xs font-bold mt-1">Кейсы</span></button>
        <button onclick="switchTab('clicker')" class="text-gray-400 hover:text-yellow-400 flex flex-col items-center"><span class="text-2xl">🦄</span><span class="text-xs font-bold mt-1">Кликер</span></button>
        <button onclick="switchTab('upgrade')" class="text-gray-400 hover:text-green-400 flex flex-col items-center"><span class="text-2xl">📈</span><span class="text-xs font-bold mt-1">Апгрейд</span></button>
        <button onclick="switchTab('profile')" class="text-gray-400 hover:text-blue-400 flex flex-col items-center"><span class="text-2xl">👤</span><span class="text-xs font-bold mt-1">Профиль</span></button>
    </nav>

    <!-- МОДАЛКА КЕЙСА -->
    <div id="modal" class="fixed inset-0 bg-black/90 hidden flex flex-col items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-[#1e293b] p-6 rounded-2xl w-full max-w-2xl relative border border-gray-700 shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl">&times;</button>
            <h3 id="modal-title" class="text-xl font-bold mb-4 text-center">Содержимое кейса</h3>
            
            <!-- Сетка превью -->
            <div id="preview-content" class="mb-6">
                <div id="preview-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
            </div>

            <!-- Рулетка -->
            <div id="roulette-content" class="hidden">
                <div class="roulette-container mb-4">
                    <div class="roulette-center-line"></div>
                    <div id="roulette-strip" class="roulette-strip"></div>
                </div>
                <p id="roulette-result" class="text-center text-xl font-bold mb-4 h-8"></p>
            </div>

            <button id="open-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-4 rounded-xl font-bold text-lg mt-4 shadow-lg">Открыть за <span id="modal-price">0</span> 🪙</button>
        </div>
    </div>

    <!-- МОДАЛКА АВТОРИЗАЦИИ -->
    <div id="auth-modal" class="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[60] backdrop-blur-md">
        <div class="bg-[#1e293b] p-8 rounded-2xl border border-purple-500/50 w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-3xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">PonyCase</h2>
            <input type="email" id="auth-email" placeholder="Email" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg mb-3 text-white outline-none">
            <input type="text" id="auth-user" placeholder="Никнейм (при регистрации)" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg mb-3 text-white outline-none">
            <input type="password" id="auth-pass" placeholder="Пароль" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg mb-6 text-white outline-none">
            <div class="flex gap-3">
                <button onclick="doLogin()" class="flex-1 bg-gray-700 py-3 rounded-lg font-bold">Вход</button>
                <button onclick="doRegister()" class="flex-1 bg-purple-600 py-3 rounded-lg font-bold">Регистрация</button>
            </div>
            <p id="auth-err" class="text-red-500 text-sm mt-4 hidden"></p>
        </div>
    </div>

    <script>
        const sounds = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
            lose: new Audio('https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3'),
            spin: new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3')
        };
        function playSound(name, loop = false) {
            const s = sounds[name];
            if(!s) return;
            s.currentTime = 0; s.loop = loop; s.volume = 0.5;
            s.play().catch(e=>console.log("Audio error", e));
        }

        const API = '';
        let token = localStorage.getItem('pony_token');
        let socket = null;
        let currentCaseId = null;
        let upgradeLevels = { click_power: 1, auto_rate: 0, multiplier: 1 };

        if(token) { document.getElementById('auth-modal').classList.add('hidden'); initGame(); }

        async function api(endpoint, method='GET', body=null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(`${API}${endpoint}`, { method, headers, body: body ? JSON.stringify(body) : null });
            const data = await res.json();
            if(!res.ok) throw new Error(data.detail || 'Error');
            return data;
        }

        async function doRegister() {
            try {
                const email = document.getElementById('auth-email').value;
                const username = document.getElementById('auth-user').value;
                const password = document.getElementById('auth-pass').value;
                const data = await api('/api/auth/register', 'POST', { email, username, password });
                localStorage.setItem('pony_token', data.token);
                location.reload();
            } catch(e) { document.getElementById('auth-err').textContent = e.message; document.getElementById('auth-err').classList.remove('hidden'); }
        }

        async function doLogin() {
            try {
                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-pass').value;
                const data = await api('/api/auth/login', 'POST', { email, password });
                localStorage.setItem('pony_token', data.token);
                location.reload();
            } catch(e) { document.getElementById('auth-err').textContent = e.message; document.getElementById('auth-err').classList.remove('hidden'); }
        }

        async function initGame() {
            try {
                const user = await api('/api/clicker/state');
                updateBalance(user.balance);
                document.getElementById('click-count').textContent = user.total_clicks;
                upgradeLevels = { click_power: user.click_power, auto_rate: user.auto_rate, multiplier: user.multiplier };
                
                loadCases();
                renderUpgrades();
                
                socket = io({ auth: { token } });
                socket.on('drop', (data) => {
                    const live = document.getElementById('live-drops');
                    const empty = live.querySelector('.italic');
                    if(empty) empty.remove();
                    const el = document.createElement('div');
                    el.className = 'drop-anim bg-gray-800 px-3 py-1.5 rounded-lg text-xs border border-gray-700 flex items-center gap-2';
                    el.innerHTML = `<span class="text-purple-400 font-bold">${data.username}</span> выбил <span style="color:${data.color}">${data.pony}</span> <span class="text-yellow-400">${data.price}🪙</span>`;
                    live.prepend(el);
                    if(live.children.length > 10) live.lastChild.remove();
                });
            } catch(e) {
                localStorage.removeItem('pony_token');
                location.reload();
            }
        }

        function updateBalance(val) { document.getElementById('balance').textContent = val; }

        function switchTab(tab) {
            playSound('click');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${tab}`).classList.add('active');
            if(tab === 'profile') loadProfile();
            if(tab === 'upgrade') loadUpgradeItems();
        }

        // --- КЕЙСЫ ---
        async function loadCases() {
            const cases = await api('/api/cases/list');
            const grid = document.getElementById('cases-grid');
            grid.innerHTML = '';
            cases.forEach(c => {
                grid.innerHTML += `
                    <div onclick="previewCase('${c.id}', ${c.price})" class="bg-[#1e293b] p-4 rounded-xl flex flex-col items-center cursor-pointer transform hover:-translate-y-1 transition border-b-4 border-purple-600">
                        <span class="text-5xl mb-2">📦</span>
                        <span class="font-bold">${c.name}</span>
                        <span class="text-yellow-400 font-bold mt-2 bg-gray-900 px-3 py-1 rounded-full text-sm">${c.price} 🪙</span>
                    </div>
                `;
            });
        }

        async function previewCase(id, price) {
            playSound('click');
            currentCaseId = id;
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            document.getElementById('preview-content').classList.remove('hidden');
            document.getElementById('roulette-content').classList.add('hidden');
            document.getElementById('roulette-result').textContent = '';
            
            document.getElementById('modal-price').textContent = price;
            document.getElementById('open-btn').onclick = () => spinCase(id);
            
            // Загружаем превью
            const previewItems = await api(`/api/cases/preview/${id}`);
            const grid = document.getElementById('preview-grid');
            grid.innerHTML = '';
            previewItems.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-gray-800 p-2 rounded-lg border-l-4 flex justify-between items-center" style="border-color: ${item.color}">
                        <div>
                            <div class="text-xs font-bold text-white">${item.name}</div>
                            <div class="text-[10px] text-gray-400 uppercase">${item.rarity}</div>
                        </div>
                        <div class="text-yellow-400 text-xs font-bold">${item.price}🪙</div>
                    </div>
                `;
            });
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        async function spinCase(caseId) {
            const btn = document.getElementById('open-btn');
            btn.disabled = true; btn.innerHTML = 'Крутим...';
            playSound('spin', true);

            try {
                const res = await api(`/api/cases/open/${caseId}`, 'POST');
                updateBalance(res.balance);

                document.getElementById('preview-content').classList.add('hidden');
                document.getElementById('roulette-content').classList.remove('hidden');
                
                const strip = document.getElementById('roulette-strip');
                strip.style.transition = 'none'; strip.style.transform = 'translateX(0)';
                strip.innerHTML = '';

                for(let i=0; i<50; i++) {
                    const isWin = i === 45; 
                    const color = isWin ? res.color : "#4b5563";
                    strip.innerHTML += `
                        <div class="roulette-item" style="border-color: ${color}">
                            <div class="text-[10px] text-center font-bold text-gray-200">${isWin ? res.pony_id : "???"}</div>
                        </div>
                    `;
                }

                setTimeout(() => {
                    strip.style.transition = 'transform 5s cubic-bezier(0.1, 0.7, 0.1, 1)';
                    const offset = (45 * 110) - (strip.parentElement.offsetWidth / 2) + 55;
                    strip.style.transform = `translateX(-${offset}px)`;

                    setTimeout(() => {
                        playSound('spin', false);
                        const resultEl = document.getElementById('roulette-result');
                        resultEl.style.color = res.color;
                        resultEl.textContent = `Выпало: ${res.pony_id} (${res.price}🪙)`;
                        
                        if(['epic', 'legendary', 'mythic', 'celestial'].includes(res.rarity)) {
                            playSound('win');
                            confetti({ particleCount: 100, spread: 70 });
                        }
                        btn.disabled = false; btn.innerHTML = 'Открыть еще раз';
                    }, 5200);
                }, 50);
            } catch(e) { alert(e.message); btn.disabled = false; btn.innerHTML = 'Открыть'; playSound('spin', false); }
        }

        // --- КЛИКЕР ---
        async function doClick() {
            playSound('click');
            try {
                const res = await api('/api/clicker/click', 'POST');
                updateBalance(res.balance);
                let c = parseInt(document.getElementById('click-count').textContent) + 1;
                document.getElementById('click-count').textContent = c;
            } catch(e) {}
        }

        function renderUpgrades() {
            const list = document.getElementById('upgrades-list');
            list.innerHTML = `
                <div class="flex justify-between items-center bg-gray-800 p-2 rounded">
                    <div><div class="font-bold text-sm">Сила клика</div><div class="text-xs text-gray-400">Ур. ${upgradeLevels.click_power}</div></div>
                    <button onclick="buyUpgrade('click_power')" class="bg-purple-600 px-3 py-1 rounded text-sm font-bold">Купить</button>
                </div>
                <div class="flex justify-between items-center bg-gray-800 p-2 rounded">
                    <div><div class="font-bold text-sm">Автоклик</div><div class="text-xs text-gray-400">Ур. ${Math.round(upgradeLevels.auto_rate * 2)}</div></div>
                    <button onclick="buyUpgrade('auto_rate')" class="bg-purple-600 px-3 py-1 rounded text-sm font-bold">Купить</button>
                </div>
                <div class="flex justify-between items-center bg-gray-800 p-2 rounded">
                    <div><div class="font-bold text-sm">Множитель</div><div class="text-xs text-gray-400">Ур. ${Math.round((upgradeLevels.multiplier - 1) * 4)}</div></div>
                    <button onclick="buyUpgrade('multiplier')" class="bg-purple-600 px-3 py-1 rounded text-sm font-bold">Купить</button>
                </div>
            `;
        }

        async function buyUpgrade(key) {
            playSound('click');
            try {
                const res = await api(`/api/clicker/buy/${key}`, 'POST');
                updateBalance(res.user.balance);
                upgradeLevels = { click_power: res.user.click_power, auto_rate: res.user.auto_rate, multiplier: res.user.multiplier };
                renderUpgrades();
            } catch(e) { alert(e.message); }
        }

        // --- ПРОФИЛЬ ---
        async function loadProfile() {
            const data = await api('/api/user/profile');
            updateBalance(data.user.balance);
            document.getElementById('stat-clicks').textContent = data.stats.total_clicks;
            document.getElementById('stat-cases').textContent = data.stats.cases_opened;
            
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            if(data.inventory.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">Инвентарь пуст</div>';
                return;
            }
            data.inventory.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-[#1e293b] p-3 rounded-xl border-t-2" style="border-color: ${item.color}">
                        <div class="text-xs text-center font-bold mb-1">${item.name}</div>
                        <div class="text-[10px] text-center text-gray-400 mb-2">${item.rarity}</div>
                        <div class="text-yellow-400 text-sm text-center mb-2 font-bold">${item.price} 🪙</div>
                        <button onclick="sellItem(${item.id})" class="bg-gray-800 hover:bg-red-600 w-full py-1 rounded text-xs font-bold transition">Продать</button>
                    </div>
                `;
            });
        }

        async function sellItem(id) {
            playSound('click');
            try {
                const res = await api(`/api/user/inventory/sell/${id}`, 'POST');
                updateBalance(res.balance); loadProfile();
            } catch(e) { alert(e.message); }
        }

        async function sellAll() {
            if(!confirm("Продать ВСЁ?")) return;
            playSound('click');
            try {
                const res = await api('/api/user/inventory/sell_all', 'POST');
                updateBalance(res.balance); loadProfile();
            } catch(e) { alert(e.message); }
        }

        // --- АПГРЕЙД ---
        async function loadUpgradeItems() {
            const data = await api('/api/user/profile');
            const select = document.getElementById('upg-item');
            select.innerHTML = '<option value="">Выбери предмет</option>';
            data.inventory.forEach(i => {
                select.innerHTML += `<option value="${i.id}" data-price="${i.price}">${i.name} (${i.price}🪙)</option>`;
            });
        }

        document.getElementById('upg-target').addEventListener('input', (e) => {
            const targetPrice = parseInt(e.target.value);
            const select = document.getElementById('upg-item');
            const itemId = select.value;
            if(!targetPrice || !itemId) return;
            
            const itemPrice = parseInt(select.options[select.selectedIndex].getAttribute('data-price'));
            let chance = (itemPrice / targetPrice) * 100;
            if(chance > 90) chance = 90; if(chance < 1) chance = 1;
            
            document.getElementById('upg-wheel').style.setProperty('--chance', `${chance}%`);
            document.getElementById('upg-chance-text').textContent = `${Math.round(chance)}%`;
        });

        async function doUpgrade() {
            const itemId = document.getElementById('upg-item').value;
            const target = document.getElementById('upg-target').value;
            if(!itemId || !target) return alert("Заполни поля");
            
            const arrow = document.getElementById('upg-arrow');
            arrow.style.transition = 'none'; arrow.style.transform = 'translateX(-50%) rotate(0deg)';
            playSound('spin', true);
            
            try {
                const res = await api('/api/upgrade/play', 'POST', { item_id: parseInt(itemId), target_price: parseInt(target) });
                
                setTimeout(() => {
                    arrow.style.transition = 'transform 3s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    let targetDeg = res.win ? 3600 + (res.chance / 2) : 3600 + res.chance + ((100 - res.chance) / 2);
                    arrow.style.transform = `translateX(-50%) rotate(${targetDeg}deg)`;
                    
                    setTimeout(() => {
                        playSound('spin', false);
                        if(res.win) { playSound('win'); confetti({ particleCount: 100 }); alert(`ПОБЕДА! Шанс: ${res.chance}%`); }
                        else { playSound('lose'); alert(`Проигрыш... Шанс: ${res.chance}%`); }
                        loadUpgradeItems(); loadProfile();
                    }, 3000);
                }, 100);
            } catch(e) { alert(e.message); playSound('spin', false); }
        }
    </script>
</body>
</html>
