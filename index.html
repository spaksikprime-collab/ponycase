<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PonyCase | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b1120; --card: rgba(30, 41, 59, 0.7); --accent: #8b5cf6; }
        body { background-color: var(--bg); color: #f8fafc; font-family: 'Montserrat', sans-serif; overflow-x: hidden; background-image: radial-gradient(circle at 50% -20%, #2e1065 0%, var(--bg) 50%); }
        
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37); }
        .btn { transition: all 0.2s; user-select: none; }
        .btn:active { transform: scale(0.95); }
        
        /* Скроллбар */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        /* Рулетка */
        .roulette-container { width: 100%; overflow: hidden; position: relative; padding: 20px 0; background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; }
        .roulette-strip { display: flex; gap: 10px; will-change: transform; }
        .roulette-item { min-width: 100px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e293b; border-radius: 8px; border: 2px solid transparent; }
        .roulette-center-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #ef4444; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 15px #ef4444; }

        /* Мины */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; }
        .mine-cell { aspect-ratio: 1; background: #1e293b; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; transition: 0.2s; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3); }
        .mine-cell:active { transform: scale(0.95); }
        .mine-cell.opened { background: #064e3b; box-shadow: inset 0 0 10px #10b981; cursor: default; }
        .mine-cell.boom { background: #7f1d1d; box-shadow: inset 0 0 10px #ef4444; }

        /* Анимации */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .page { display: none; }
        .page.active { display: block; animation: slideUp 0.3s ease-out; }
        
        /* Модалки */
        .modal-bg { background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <!-- HEADER -->
    <header class="glass sticky top-0 z-40 px-4 py-3 flex justify-between items-center rounded-b-2xl">
        <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 cursor-pointer" onclick="switchTab('cases')">PONYCASE 🦄</h1>
        <div class="flex items-center gap-2">
            <div class="bg-gray-900/80 px-3 py-1.5 rounded-lg border border-yellow-500/30 flex items-center gap-1">
                <span id="balance" class="text-yellow-400 font-bold">0</span> <span class="text-xs">🪙</span>
            </div>
        </div>
    </header>

    <!-- LIVE ДРОПЫ -->
    <div class="bg-[#0f172a]/80 border-b border-gray-800 py-2 overflow-hidden relative shadow-lg">
        <div id="live-drops" class="flex gap-2 whitespace-nowrap px-4 items-center text-xs">
            <span class="text-gray-500 italic">Ожидание дропов...</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 max-w-lg mx-auto w-full">
        
        <!-- КЕЙСЫ -->
        <div id="page-cases" class="page active">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span class="w-1.5 h-5 bg-purple-500 rounded"></span> Кейсы</h2>
            <div id="cases-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- БАТЛЫ -->
        <div id="page-battles" class="page">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2"><span class="w-1.5 h-5 bg-red-500 rounded"></span> Батлы</h2>
                <button onclick="createBattle()" class="btn bg-purple-600 px-3 py-1.5 rounded-lg font-bold text-xs">Создать</button>
            </div>
            <div id="battles-list" class="flex flex-col gap-3"></div>
        </div>

        <!-- МИНЫ -->
        <div id="page-mines" class="page">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span class="w-1.5 h-5 bg-green-500 rounded"></span> Мины</h2>
            <div class="glass p-5 rounded-2xl flex flex-col items-center">
                <div id="mines-start-screen" class="w-full max-w-xs">
                    <input type="number" id="mines-bet" placeholder="Ставка (мин 10)" class="w-full bg-gray-900 p-3 rounded-xl mb-3 text-white outline-none border border-gray-700 focus:border-green-500">
                    <select id="mines-count" class="w-full bg-gray-900 p-3 rounded-xl mb-4 text-white outline-none border border-gray-700">
                        <option value="3">3 Мины (Легко)</option>
                        <option value="5">5 Мин (Средне)</option>
                        <option value="10">10 Мин (Хардкор)</option>
                    </select>
                    <button onclick="startMines()" class="btn w-full bg-green-600 py-3 rounded-xl font-bold shadow-[0_0_15px_rgba(34,197,94,0.4)]">Начать</button>
                </div>
                <div id="mines-play-screen" class="hidden w-full flex flex-col items-center">
                    <div class="flex justify-between w-full max-w-[320px] mb-3 text-sm font-bold">
                        <div class="text-gray-400">Множ: <span id="mines-multi" class="text-green-400">1.0x</span></div>
                        <div class="text-gray-400">Забрать: <span id="mines-next" class="text-yellow-400">0🪙</span></div>
                    </div>
                    <div id="mines-grid" class="mines-grid"></div>
                    <button onclick="cashoutMines()" class="btn mt-5 w-full max-w-[320px] bg-yellow-500 text-black py-3 rounded-xl font-bold">ЗАБРАТЬ</button>
                </div>
            </div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="page-profile" class="page">
            <div class="glass p-5 rounded-2xl mb-4 flex flex-col items-center relative">
                <div class="relative w-24 h-24 mb-2">
                    <img id="profile-avatar-img" class="w-full h-full rounded-full object-cover border-2 border-purple-500 hidden">
                    <div id="profile-avatar-emoji" class="w-full h-full rounded-full bg-gray-800 flex items-center justify-center text-5xl border-2 border-purple-500">🦄</div>
                </div>
                
                <!-- Загрузка фото -->
                <label class="btn bg-purple-600 text-xs px-3 py-1 rounded-full cursor-pointer absolute bottom-16">
                    Сменить фото
                    <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="uploadAvatar(this)">
                </label>

                <div class="text-lg font-bold mt-1" id="profile-name">Loading...</div>
                <div class="flex justify-around w-full mt-4 text-center bg-gray-900/50 p-2 rounded-xl">
                    <div><div class="text-gray-400 text-[10px] uppercase">Клики</div><div id="stat-clicks" class="font-bold text-yellow-400">0</div></div>
                    <div><div class="text-gray-400 text-[10px] uppercase">Кейсы</div><div id="stat-cases" class="font-bold text-purple-400">0</div></div>
                </div>
            </div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold">Инвентарь</h2>
                <button onclick="sellAll()" class="btn bg-red-500/20 text-red-400 px-3 py-1 rounded-lg text-xs border border-red-500/50">Продать Всё</button>
            </div>
            <div id="inventory-grid" class="grid grid-cols-3 gap-2"></div>
        </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 w-full glass flex justify-around py-2 z-40 rounded-t-2xl">
        <button onclick="switchTab('cases')" class="text-gray-400 hover:text-purple-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl mb-1">📦</span>Кейсы</button>
        <button onclick="switchTab('battles')" class="text-gray-400 hover:text-red-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl mb-1">⚔️</span>Батлы</button>
        <button onclick="switchTab('mines')" class="text-gray-400 hover:text-green-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl mb-1">💣</span>Мины</button>
        <button onclick="switchTab('profile')" class="text-gray-400 hover:text-blue-400 flex flex-col items-center text-[10px] font-bold"><span class="text-xl mb-1">👤</span>Профиль</button>
    </nav>

    <!-- МОДАЛКА АВТОРИЗАЦИИ (КРАСИВАЯ) -->
    <div id="auth-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-[100]">
        <div class="glass p-6 rounded-3xl w-full max-w-sm relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-500 rounded-full blur-3xl opacity-30"></div>
            
            <h2 class="text-2xl font-black mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">Вход в PonyCase</h2>
            
            <!-- Шаг 1: Форма -->
            <div id="auth-step-1">
                <button onclick="alert('Для входа через Google нужно настроить Google Cloud Console. Пока используй почту.')" class="w-full bg-white text-black font-bold py-3 rounded-xl mb-4 flex items-center justify-center gap-2">
                    <img src="https://www.google.com/favicon.ico" class="w-5 h-5"> Войти через Google
                </button>
                <div class="flex items-center gap-2 mb-4 opacity-50"><hr class="flex-1"><span class="text-xs">или</span><hr class="flex-1"></div>
                
                <input type="email" id="auth-email" placeholder="Email" class="w-full bg-gray-900/80 border border-gray-700 p-3 rounded-xl mb-2 text-white outline-none focus:border-purple-500">
                <input type="text" id="auth-user" placeholder="Никнейм (только для реги)" class="w-full bg-gray-900/80 border border-gray-700 p-3 rounded-xl mb-2 text-white outline-none focus:border-purple-500">
                <input type="password" id="auth-pass" placeholder="Пароль" class="w-full bg-gray-900/80 border border-gray-700 p-3 rounded-xl mb-4 text-white outline-none focus:border-purple-500">
                
                <div class="flex gap-2">
                    <button onclick="doLogin()" class="btn flex-1 bg-gray-700 py-3 rounded-xl font-bold">Вход</button>
                    <button onclick="doRegister()" class="btn flex-1 bg-purple-600 py-3 rounded-xl font-bold shadow-[0_0_15px_rgba(168,85,247,0.5)]">Регистрация</button>
                </div>
            </div>

            <!-- Шаг 2: Код с почты -->
            <div id="auth-step-2" class="hidden text-center">
                <p class="text-sm text-gray-400 mb-4">Мы отправили код на твою почту. Введи его ниже (код также виден в логах ZevCloud).</p>
                <input type="text" id="auth-code" placeholder="000000" class="w-full bg-gray-900/80 border border-gray-700 p-3 rounded-xl mb-4 text-white text-center text-2xl tracking-widest outline-none focus:border-purple-500">
                <button onclick="doVerify()" class="btn w-full bg-green-600 py-3 rounded-xl font-bold shadow-[0_0_15px_rgba(34,197,94,0.5)]">Подтвердить</button>
            </div>
            
            <p id="auth-err" class="text-red-500 text-xs mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- МОДАЛКА КЕЙСА -->
    <div id="modal-case" class="fixed inset-0 modal-bg hidden flex flex-col items-center justify-center p-4 z-50">
        <div class="glass p-5 rounded-2xl w-full max-w-md relative">
            <button onclick="document.getElementById('modal-case').classList.add('hidden')" class="absolute top-3 right-4 text-2xl text-gray-400">&times;</button>
            <h3 id="modal-title" class="text-lg font-bold mb-4 text-center">Содержимое</h3>
            
            <div id="preview-content" class="mb-4"><div id="preview-grid" class="grid grid-cols-2 gap-2"></div></div>
            
            <div id="roulette-content" class="hidden">
                <div class="roulette-container mb-3"><div class="roulette-center-line"></div><div id="roulette-strip" class="roulette-strip"></div></div>
                <p id="roulette-result" class="text-center text-lg font-bold mb-3 h-6"></p>
            </div>
            
            <button id="open-btn" class="btn w-full bg-gradient-to-r from-purple-600 to-pink-600 py-3 rounded-xl font-bold text-lg shadow-lg">Открыть за <span id="modal-price">0</span> 🪙</button>
        </div>
    </div>

    <!-- БАТЛ РУМ (УПРОЩЕННЫЙ) -->
    <div id="battle-room" class="fixed inset-0 modal-bg hidden z-[60] flex flex-col items-center justify-center p-4">
        <div class="text-2xl font-black mb-6 text-purple-400" id="battle-status">Ожидание...</div>
        <div class="text-center">
            <div class="text-6xl mb-4">⚔️</div>
            <div class="text-sm text-gray-400">Игроков: <span id="battle-players">1</span></div>
            <div class="text-xl font-bold text-yellow-400 mt-2">Банк: <span id="battle-bank">0</span>🪙</div>
        </div>
        <div class="mt-8 flex gap-3">
            <button id="battle-start-btn" onclick="startBattle()" class="hidden bg-green-500 px-6 py-2 rounded-xl font-bold">СТАРТ</button>
            <button onclick="document.getElementById('battle-room').classList.add('hidden')" class="bg-gray-700 px-6 py-2 rounded-xl font-bold">Выйти</button>
        </div>
    </div>

    <script>
        // --- ЗВУКИ ---
        const sfx = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
            lose: new Audio('https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3'),
            spin: new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3')
        };
        function playSfx(name, loop = false) {
            if(!sfx[name]) return;
            sfx[name].currentTime = 0; sfx[name].loop = loop; sfx[name].volume = 0.4;
            sfx[name].play().catch(e=>{});
        }
        
        // Клик по любым кнопкам (глобально)
        document.addEventListener('click', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.closest('button')) playSfx('click');
        });

        // --- API ---
        const API = '';
        let token = localStorage.getItem('pony_token');
        let socket = null;
        let tempEmail = '';
        let userData = null;

        if(token) { document.getElementById('auth-modal').classList.add('hidden'); init(); }

        async function api(endpoint, method='GET', body=null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(`${API}${endpoint}`, { method, headers, body: body ? JSON.stringify(body) : null });
            const data = await res.json();
            if(!res.ok) throw new Error(data.detail || 'Error');
            return data;
        }

        // --- АВТОРИЗАЦИЯ ---
        async function doRegister() {
            try {
                const email = document.getElementById('auth-email').value;
                const username = document.getElementById('auth-user').value;
                const password = document.getElementById('auth-pass').value;
                await api('/api/auth/register', 'POST', { email, username, password });
                tempEmail = email;
                document.getElementById('auth-step-1').classList.add('hidden');
                document.getElementById('auth-step-2').classList.remove('hidden');
            } catch(e) { showAuthError(e.message); }
        }

        async function doVerify() {
            try {
                const code = document.getElementById('auth-code').value;
                const data = await api('/api/auth/verify', 'POST', { email: tempEmail, code });
                saveAuth(data);
            } catch(e) { showAuthError(e.message); }
        }

        async function doLogin() {
            try {
                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-pass').value;
                const data = await api('/api/auth/login', 'POST', { email, password });
                saveAuth(data);
            } catch(e) { showAuthError(e.message); }
        }

        function saveAuth(data) {
            token = data.token; localStorage.setItem('pony_token', token);
            document.getElementById('auth-modal').classList.add('hidden'); init();
        }
        function showAuthError(msg) {
            const el = document.getElementById('auth-err'); el.textContent = msg; el.classList.remove('hidden');
        }

        // --- ЗАГРУЗКА ФОТО ---
        async function uploadAvatar(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const formData = new FormData();
            formData.append("file", file);

            try {
                const res = await fetch(`${API}/api/user/avatar`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await res.json();
                if(!res.ok) throw new Error(data.detail);
                
                // Обновляем UI
                document.getElementById('profile-avatar-img').src = data.avatar;
                document.getElementById('profile-avatar-img').classList.remove('hidden');
                document.getElementById('profile-avatar-emoji').classList.add('hidden');
                playSfx('win');
            } catch(e) { alert("Ошибка загрузки: " + e.message); }
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        async function init() {
            try {
                userData = await api('/api/clicker/state');
                updateBalance(userData.balance);
                loadCases();
                
                socket = io({ auth: { token } });
                socket.on('drop', (data) => {
                    const live = document.getElementById('live-drops');
                    if(live.querySelector('.italic')) live.innerHTML = '';
                    const el = document.createElement('div');
                    el.className = 'bg-gray-800/80 px-2 py-1 rounded-md flex items-center gap-1 border border-gray-700';
                    el.innerHTML = `<img src="${data.avatar}" class="w-4 h-4 rounded-full inline-block"> <b>${data.username}</b> выбил <span style="color:${data.color}">${data.pony}</span> <span class="text-gray-500">(${data.source})</span>`;
                    live.prepend(el);
                    if(live.children.length > 10) live.lastChild.remove();
                });
            } catch(e) { localStorage.removeItem('pony_token'); location.reload(); }
        }

        function updateBalance(val) { document.getElementById('balance').textContent = val; }

        function switchTab(tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${tab}`).classList.add('active');
            if(tab === 'battles') loadBattles();
            if(tab === 'profile') loadProfile();
        }

        // --- КЕЙСЫ ---
        async function loadCases() {
            const cases = await api('/api/cases/list');
            const grid = document.getElementById('cases-grid');
            grid.innerHTML = '';
            cases.forEach(c => {
                grid.innerHTML += `
                    <div onclick="previewCase('${c.id}', ${c.price})" class="glass p-3 rounded-xl flex flex-col items-center cursor-pointer transform hover:-translate-y-1 transition border-b-2 border-purple-600">
                        <span class="text-4xl mb-1">📦</span><span class="font-bold text-xs">${c.name}</span>
                        <span class="text-yellow-400 font-bold mt-1 bg-gray-900/50 px-2 py-0.5 rounded text-[10px]">${c.price} 🪙</span>
                    </div>`;
            });
        }
        async function previewCase(id, price) {
            document.getElementById('modal-case').classList.remove('hidden');
            document.getElementById('preview-content').classList.remove('hidden');
            document.getElementById('roulette-content').classList.add('hidden');
            document.getElementById('modal-price').textContent = price;
            document.getElementById('open-btn').onclick = () => spinCase(id);
            
            const items = await api(`/api/cases/preview/${id}`);
            const grid = document.getElementById('preview-grid'); grid.innerHTML = '';
            items.forEach(i => { grid.innerHTML += `<div class="bg-gray-800/80 p-2 rounded-lg border-l-2" style="border-color:${i.color}"><div class="text-[10px] font-bold truncate">${i.name}</div><div class="text-yellow-400 text-[10px]">${i.price}🪙</div></div>`; });
        }
        async function spinCase(caseId) {
            const btn = document.getElementById('open-btn'); btn.disabled = true; btn.textContent = '...';
            playSfx('spin', true);
            try {
                const res = await api(`/api/cases/open/${caseId}`, 'POST');
                updateBalance(res.balance);
                document.getElementById('preview-content').classList.add('hidden');
                document.getElementById('roulette-content').classList.remove('hidden');
                const strip = document.getElementById('roulette-strip');
                strip.style.transition = 'none'; strip.style.transform = 'translateX(0)'; strip.innerHTML = '';
                for(let i=0; i<50; i++) {
                    strip.innerHTML += `<div class="roulette-item" style="border-color:${i===45?res.color:'#334155'}"><div class="text-[10px] font-bold text-center px-1">${i===45?res.pony_id:'???'}</div></div>`;
                }
                setTimeout(() => {
                    strip.style.transition = 'transform 5s cubic-bezier(0.1, 0.7, 0.1, 1)';
                    strip.style.transform = `translateX(-${(45 * 110) - (strip.parentElement.offsetWidth / 2) + 55}px)`;
                    setTimeout(() => {
                        playSfx('spin', false);
                        document.getElementById('roulette-result').style.color = res.color;
                        document.getElementById('roulette-result').textContent = `${res.pony_id} (${res.price}🪙)`;
                        btn.disabled = false; btn.textContent = 'Ещё раз';
                        if(['epic','legendary','mythic','celestial'].includes(res.rarity)) { playSfx('win'); confetti(); } else { playSfx('lose'); }
                    }, 5200);
                }, 50);
            } catch(e) { playSfx('spin', false); alert(e.message); btn.disabled = false; }
        }

        // --- ПРОФИЛЬ ---
        async function loadProfile() {
            const data = await api('/api/user/profile');
            updateBalance(data.user.balance);
            document.getElementById('profile-name').textContent = data.user.username;
            document.getElementById('stat-clicks').textContent = data.stats.total_clicks;
            document.getElementById('stat-cases').textContent = data.stats.cases_opened;
            
            if(data.user.avatar && data.user.avatar.startsWith('data:image')) {
                document.getElementById('profile-avatar-img').src = data.user.avatar;
                document.getElementById('profile-avatar-img').classList.remove('hidden');
                document.getElementById('profile-avatar-emoji').classList.add('hidden');
            } else {
                document.getElementById('profile-avatar-emoji').textContent = data.user.avatar || '🦄';
                document.getElementById('profile-avatar-img').classList.add('hidden');
                document.getElementById('profile-avatar-emoji').classList.remove('hidden');
            }

            const grid = document.getElementById('inventory-grid'); grid.innerHTML = '';
            data.inventory.forEach(item => {
                grid.innerHTML += `<div class="glass p-2 rounded-lg border-t-2" style="border-color:${item.color}"><div class="text-[9px] text-center font-bold truncate">${item.name}</div><div class="text-[9px] text-yellow-400 text-center">${item.price}🪙</div><button onclick="sellItem(${item.id})" class="bg-gray-800 hover:bg-red-600 w-full mt-1 py-1 rounded text-[9px] font-bold transition">Продать</button></div>`;
            });
        }
        async function sellItem(id) { const r = await api(`/api/user/inventory/sell/${id}`, 'POST'); updateBalance(r.balance); loadProfile(); }
        async function sellAll() { if(!confirm("Продать всё?")) return; const r = await api('/api/user/inventory/sell_all', 'POST'); updateBalance(r.balance); loadProfile(); }

        // --- МИНЫ ---
        function startMines() {
            const bet = parseInt(document.getElementById('mines-bet').value);
            const mines = parseInt(document.getElementById('mines-count').value);
            api('/api/mines/start', 'POST', {bet, mines}).then(res => {
                updateBalance(res.balance);
                window.minesGameId = res.game_id;
                document.getElementById('mines-start-screen').classList.add('hidden');
                document.getElementById('mines-play-screen').classList.remove('hidden');
                const grid = document.getElementById('mines-grid'); grid.innerHTML = '';
                for(let i=0; i<25; i++) { grid.innerHTML += `<div class="mine-cell" id="cell-${i}" onclick="clickMine(${i})"></div>`; }
                document.getElementById('mines-multi').textContent = '1.0x';
                document.getElementById('mines-next').textContent = bet + '🪙';
            }).catch(e => alert(e.message));
        }
        async function clickMine(index) {
            if(!window.minesGameId) return;
            try {
                const res = await api('/api/mines/click', 'POST', {game_id: window.minesGameId, cell: index});
                const cell = document.getElementById(`cell-${index}`);
                if(res.status === 'boom') {
                    cell.classList.add('boom'); cell.textContent = '💥';
                    res.mines.forEach(m => { const c = document.getElementById(`cell-${m}`); if(c) { c.classList.add('boom'); c.textContent = '💣'; } });
                    playSfx('lose'); alert("Взрыв! Проигрыш.");
                    window.minesGameId = null;
                    setTimeout(() => { document.getElementById('mines-start-screen').classList.remove('hidden'); document.getElementById('mines-play-screen').classList.add('hidden'); }, 2000);
                } else if (res.status === 'ok') {
                    cell.classList.add('opened'); cell.textContent = '💎'; playSfx('click');
                    document.getElementById('mines-multi').textContent = res.multiplier + 'x';
                    document.getElementById('mines-next').textContent = res.next_win + '🪙';
                } else if (res.status === 'win') {
                    cell.classList.add('opened'); cell.textContent = '💎';
                    updateBalance(res.balance); playSfx('win'); confetti();
                    alert(`Джекпот! Ты выиграл ${res.amount}🪙`);
                    window.minesGameId = null;
                    setTimeout(() => { document.getElementById('mines-start-screen').classList.remove('hidden'); document.getElementById('mines-play-screen').classList.add('hidden'); }, 2000);
                }
            } catch(e) { alert(e.message); }
        }
        async function cashoutMines() {
            if(!window.minesGameId) return;
            try {
                const res = await api('/api/mines/cashout', 'POST', {game_id: window.minesGameId});
                updateBalance(res.balance); playSfx('win');
                alert(`Ты забрал ${res.amount}🪙`);
                window.minesGameId = null;
                document.getElementById('mines-start-screen').classList.remove('hidden');
                document.getElementById('mines-play-screen').classList.add('hidden');
            } catch(e) { alert(e.message); }
        }

        // --- БАТЛЫ (Заглушка для UI) ---
        async function loadBattles() {
            const battles = await api('/api/battles/active');
            const list = document.getElementById('battles-list');
            list.innerHTML = battles.length ? '' : '<div class="text-center text-gray-500 text-sm">Нет активных батлов</div>';
            battles.forEach(b => {
                list.innerHTML += `<div class="glass p-3 rounded-xl flex justify-between items-center"><div><div class="font-bold text-xs">Кейс: ${b.case_id}</div><div class="text-[10px] text-gray-400">Игроки: ${b.players}/${b.max} | Банк: ${b.total_value}🪙</div></div><button onclick="joinBattle('${b.id}')" class="bg-purple-600 px-3 py-1 rounded-lg font-bold text-xs">Войти</button></div>`;
            });
        }
        async function joinBattle(id) {
            const res = await api('/api/battles/join', 'POST', {battle_id: id});
            updateBalance(res.balance);
            document.getElementById('battle-room').classList.remove('hidden');
            document.getElementById('battle-status').textContent = "Ожидание...";
        }
        async function createBattle() {
            const caseId = prompt("ID кейса (starter, royal, celestial):");
            if(!caseId) return;
            const res = await api('/api/battles/create', 'POST', {case_id: caseId, max_players: 4});
            updateBalance(res.balance);
            document.getElementById('battle-room').classList.remove('hidden');
        }
        async function startBattle() { alert("Батл запущен (демо)"); }
    </script>
</body>
</html>
